<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TunICA viewer</title>
<link rel="icon" href="favicon.ico">
<script src="theme.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="bar">
  <img class="bar__mark" src="mark.png" alt="" width="28" height="28">
  <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
  <span class="bar__spacer"></span>
  <nav class="bar__controls" aria-label="View">
    <button class="control control--icon theme-toggle" type="button" id="theme-toggle" title="Switch between light and dark" aria-label="Switch theme">
      <svg class="theme-toggle__glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true" focusable="false">
        <circle class="theme-toggle__disc" cx="12" cy="12" r="5" />
        <g class="theme-toggle__rays">
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" />
        </g>
        <path class="theme-toggle__crescent" d="M12 3a6 6 0 009 9 9 9 0 11-9-9Z" />
      </svg>
    </button>
  </nav>
</header>

<main class="stage">
  <div class="paper">
    <section class="stored" id="stored" hidden>
      <header class="stored__head" id="stored-head">
        <button class="control control--icon mapper__open" id="mapper-open" type="button" hidden
                title="Map a repository" aria-label="Map a repository" aria-expanded="false" aria-controls="mapper">
          <svg class="control__glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true" focusable="false">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
        <h2 class="stored__title" id="stored-title">Stored maps</h2>
        <form class="mapper" id="mapper">
          <input class="mapper__input" id="target" name="target" type="text" autocomplete="off"
                 placeholder="owner/repo, a git URL, or a path on the host. Enter to map.">
          <label class="switch" for="deep" title="Map every component, not just the system map">
            <input class="switch__input" id="deep" type="checkbox" aria-label="Map every component, not just the system map">
            <span class="switch__track"><span class="switch__knob"></span></span>
          </label>
          <button class="visually-hidden" type="submit">Map</button>
        </form>
        <button class="control control--icon view-toggle" id="view-toggle" type="button" title="Switch between cards and rows" aria-label="Switch arrangement">
          <svg class="control__glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true" focusable="false">
            <g class="view-toggle__grid">
              <rect x="3.5" y="3.5" width="7" height="7" rx="1.5" />
              <rect x="13.5" y="3.5" width="7" height="7" rx="1.5" />
              <rect x="3.5" y="13.5" width="7" height="7" rx="1.5" />
              <rect x="13.5" y="13.5" width="7" height="7" rx="1.5" />
            </g>
            <path class="view-toggle__list" d="M4 6.5h16M4 12h16M4 17.5h16" />
          </svg>
        </button>
      </header>
      <nav class="cards" id="index" aria-label="Stored maps"></nav>
    </section>
    <div class="frame" id="frame">
      <div class="diagram" id="diagram"></div>
      <button class="zoom" id="zoom-reset" type="button" title="Back to the fitted view">100%</button>
      <button class="zen" id="zen" type="button" title="Focus mode (fullscreen)" aria-label="Focus mode (fullscreen)" aria-pressed="false">
        <svg class="control__glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <g class="zen__out"><path d="M9 3H5a2 2 0 0 0-2 2v4M15 3h4a2 2 0 0 1 2 2v4M21 15v4a2 2 0 0 1-2 2h-4M3 15v4a2 2 0 0 0 2 2h4"/></g>
          <g class="zen__in"><path d="M9 3v4a2 2 0 0 1-2 2H3M15 3v4a2 2 0 0 0 2 2h4M21 15h-4a2 2 0 0 0-2 2v4M3 15h4a2 2 0 0 1 2 2v4"/></g>
        </svg>
      </button>
    </div>
    <p class="notice" id="status">Loading…</p>
  </div>
</main>

<footer class="footer">
  <span class="footer__tools">
    <button class="footer__tool term-toggle" id="term-toggle" type="button"
            title="Run log" aria-label="Open the run log" aria-expanded="false" aria-controls="term">
      <svg class="footer__glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" focusable="false">
        <rect x="2.5" y="4" width="19" height="16" rx="2"></rect>
        <path d="M6.5 9.5 9.5 12l-3 2.5M12.5 15h5"></path>
      </svg>
    </button>
    <button class="footer__tool" id="update-now" type="button" hidden
            title="Update TunICA" aria-label="Update TunICA">
      <svg class="footer__glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" focusable="false">
        <path d="M12 3v12M7.5 10.5 12 15l4.5-4.5M4 19h16"></path>
      </svg>
    </button>
    <a class="footer__tool" id="gh" href="https://github.com/Arelius-D/TunICA" target="_blank" rel="noopener noreferrer"
       title="TunICA on GitHub" aria-label="TunICA on GitHub">
      <svg class="footer__glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" focusable="false">
        <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
      </svg>
    </a>
  </span>
</footer>

<section class="term" id="term" aria-label="Run log" aria-live="polite">
  <header class="term__bar">
    <span class="term__lights">
      <button class="term__light term__light--close" id="term-close" type="button" title="Close" aria-label="Close the run log"></button>
      <button class="term__light term__light--min" id="term-min" type="button" title="Minimise" aria-label="Minimise the run log"></button>
      <button class="term__light term__light--max" id="term-max" type="button" title="Maximise" aria-label="Maximise the run log"></button>
    </span>
    <span class="term__title" id="term-title">No run yet</span>
  </header>
  <pre class="term__log" id="term-log">Nothing has run in this session.</pre>
</section>

<div class="measure" id="measure" aria-hidden="true"></div>

<script type="module" src="viewer.js"></script>
</body>
</html>
